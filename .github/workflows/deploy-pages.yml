# Veroeffentlicht die Seite bei jedem Push auf main als GitHub Page.
# Einmalig noetig: Settings -> Pages -> Source auf "GitHub Actions" stellen.
name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite pruefen
        run: |
          for f in js/data.js js/storage.js js/app.js sw.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
