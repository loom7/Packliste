<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12243D">
<title>Packliste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Libre+Franklin:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>Packliste</h1>
    <small id="status">wird geladen</small>
  </div>
  <div class="mrz" id="mrz" aria-hidden="true"></div>
  <div class="bar"><i id="bar"></i></div>
</header>

<div class="controls">
  <p class="eyebrow">Reiseart wählen — blendet passende Blöcke ein</p>
  <div class="chips" id="chips"></div>
  <div class="toolbar">
    <button class="tool" id="filter" aria-pressed="false">Nur Offenes zeigen</button>
    <button class="tool" id="fold">Alle einklappen</button>
    <button class="tool danger" id="reset">Zurücksetzen</button>
  </div>
</div>

<main id="app"></main>
<footer id="foot"></footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
